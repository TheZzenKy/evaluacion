{% extends "fiores/base.html" %}

{% block content %}
    <h1>Confirmar eliminación</h1>
    <p>¿Seguro que quieres eliminar esta {{ tipo }}: {{ objeto }}?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Sí, eliminar</button>
        <a href="{% url cancelar_url objeto.pk %}">Cancelar</a>
    </form>
{% endblock %}
