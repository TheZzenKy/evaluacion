{% extends "fiores/base.html" %}

{% block content %}
    <h1>Categorías</h1>
    <p><a href="{% url 'categoria_crear' %}">Crear categoría</a></p>
    <ul>
        {% for categoria in categorias %}
            <li>
                <a href="{% url 'categoria_detalle' categoria.pk %}">{{ categoria.nombre }}</a>
                {% if categoria.activa %}(activa){% else %}(inactiva){% endif %}
            </li>
        {% empty %}
            <li>No hay categorías.</li>
        {% endfor %}
    </ul>
{% endblock %}
